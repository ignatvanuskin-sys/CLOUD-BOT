name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: cloud_bot }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
      minio:
        image: minio/minio
        env: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
        ports: ['9000:9000']
        options: --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
        command: server /data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:production-fixes
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run security:scan
      - run: npm run deps:audit
      - name: Create S3 contract bucket
        run: |
          node -e "const {S3Client,CreateBucketCommand}=require('@aws-sdk/client-s3');const s=new S3Client({region:'us-east-1',endpoint:'http://localhost:9000',forcePathStyle:true,credentials:{accessKeyId:'minioadmin',secretAccessKey:'minioadmin'}});s.send(new CreateBucketCommand({Bucket:'cloud-bot-contracts'})).catch(e=>{if(e.name!=='BucketAlreadyOwnedByYou'&&e.name!=='BucketAlreadyExists')throw e})"
      - run: npm run test:adapters
        env:
          RUN_PRODUCTION_ADAPTER_CONTRACTS: 'true'
          NODE_ENV: test
          DB_DRIVER: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloud_bot
          DATABASE_SSL: 'false'
          REDIS_URL: redis://localhost:6379
          REDIS_KEY_PREFIX: 'cloud-bot:ci:'
          STORAGE_DRIVER: s3
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: cloud-bot-contracts
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_FORCE_PATH_STYLE: 'true'
      - run: git diff --check
