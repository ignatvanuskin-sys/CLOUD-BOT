<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080a11" />
  <meta name="description" content="Cloud Bot — Telegram Mini App для покупки проверенных ботов, шаблонов и модулей с оплатой Telegram Stars." />
  <meta name="robots" content="index,follow" />
  <!-- Canonical URL is injected by the deployment origin; avoid a root-directory asset reference in Vite. -->
  <meta property="og:title" content="Cloud Bot" />
  <meta property="og:description" content="Инструменты для быстрого запуска в Telegram" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ru_RU" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Cloud Bot" />
  <meta name="twitter:description" content="Инструменты для быстрого запуска в Telegram" />
  <title>Cloud Bot — Telegram Marketplace</title>
  <!-- Critical responsive styles are inline because Telegram Desktop may keep an old
       external stylesheet in its WebView cache even after the document URL changes. -->
  <style>
    html,body,#root{width:100%;max-width:100%;min-height:100%;overflow-x:hidden;background:#080a11;color:#f7f8fb}
    *,*::before,*::after{box-sizing:border-box}
    .form-card{display:grid!important;gap:14px!important;width:100%!important;min-width:0!important;max-width:100%!important;padding:16px!important}
    .form-card>label{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:7px!important;width:100%!important;min-width:0!important;font-size:13px!important;font-weight:700!important;line-height:1.3!important}
    .form-card input,.form-card textarea,.form-card select{display:block!important;width:100%!important;min-width:0!important;max-width:100%!important;padding:11px 12px!important;border:1px solid rgba(255,255,255,.09)!important;border-radius:13px!important;background:rgba(30,34,49,.82)!important;color:#f7f8fb!important;font-size:14px!important;line-height:1.35!important}
    .form-card textarea{min-height:76px!important;resize:vertical!important}
    .form-card .btn{width:100%!important;min-height:44px!important}
    @media(max-width:620px){.app-content{padding-inline:12px!important}.form-card .hero-actions{display:grid!important;grid-template-columns:1fr!important}.page,.page>*{min-width:0!important;max-width:100%!important}}
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
